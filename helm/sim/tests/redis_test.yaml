suite: redis — bundled by default, external override, REDIS_URL wiring
release:
  name: t
  namespace: sim
set:
  app.env.BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  app.env.ENCRYPTION_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  app.env.INTERNAL_API_SECRET: x
  app.env.CRON_SECRET: x
  postgresql.auth.password: xxxxxxxx
tests:
  - it: deploys Redis by default so a chart install matches the Compose stack
    template: deployment-redis.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: t-sim-redis
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:7-alpine

  - it: exposes Redis on a ClusterIP Service
    template: deployment-redis.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 6379

  - it: renders nothing when redis.enabled=false
    template: deployment-redis.yaml
    set:
      redis.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: injects the in-cluster REDIS_URL on the app when bundled
    template: deployment-app.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"

  - it: injects the in-cluster REDIS_URL on realtime when bundled
    template: deployment-realtime.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"

  - it: an existing app.env.REDIS_URL wins over the bundled instance (upgrade safety)
    template: deployment-app.yaml
    set:
      app.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "rediss://:pw@managed.example.com:6380"

  - it: does not deploy a redundant bundled Redis when an external URL is set
    template: deployment-redis.yaml
    set:
      app.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - hasDocuments:
          count: 0

  - it: falls back to an operator-supplied REDIS_URL when Redis is external
    template: deployment-app.yaml
    set:
      redis.enabled: false
      app.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "rediss://:pw@managed.example.com:6380"

  - it: omits REDIS_URL entirely when neither bundled nor supplied
    template: deployment-app.yaml
    set:
      redis.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"

  - it: does not preset free-tier plan caps, which are opt-in on a self-host
    template: deployment-app.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXECUTION_TIMEOUT_FREE
            value: "300"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FREE_TABLES_LIMIT
            value: "3"

  # Secret-manager modes carry REDIS_URL out-of-band, where the chart cannot see
  # it. Emitting a computed REDIS_URL as inline `env` would beat `envFrom` and
  # silently reroute a managed Redis to an empty in-cluster one on upgrade.
  - it: does not inject REDIS_URL in existingSecret mode
    template: deployment-app.yaml
    set:
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"

  - it: does not bundle Redis in existingSecret mode
    template: deployment-redis.yaml
    set:
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: does not inject REDIS_URL in External Secrets mode
    template: deployment-app.yaml
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"

  - it: does not bundle Redis in External Secrets mode
    template: deployment-redis.yaml
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
    asserts:
      - hasDocuments:
          count: 0

  - it: realtime also gets no computed REDIS_URL in existingSecret mode
    template: deployment-realtime.yaml
    set:
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"
