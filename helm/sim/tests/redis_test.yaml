suite: redis — bundled by default, operator-supplied URL always wins
release:
  name: t
  namespace: sim
set:
  app.env.BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  app.env.ENCRYPTION_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  app.env.INTERNAL_API_SECRET: x
  app.env.CRON_SECRET: x
  postgresql.auth.password: xxxxxxxx
tests:
  - it: deploys Redis by default so a chart install matches the Compose stack
    template: deployment-redis.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: t-sim-redis
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:7-alpine

  - it: exposes Redis on a ClusterIP Service
    template: deployment-redis.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 6379

  - it: renders nothing when redis.enabled=false
    template: deployment-redis.yaml
    set:
      redis.enabled: false
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: ships the bundled REDIS_URL as a ConfigMap
    template: configmap-redis.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.REDIS_URL
          value: "redis://t-sim-redis:6379"

  # Kubernetes lets the LAST envFrom source win, so the Redis ConfigMap must be
  # listed before the app Secret. Reversing these would shadow an operator's
  # REDIS_URL with the bundled one.
  - it: lists the Redis ConfigMap before the app Secret on the app
    template: deployment-app.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: t-sim-redis
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: t-sim-app-secrets

  - it: lists the Redis ConfigMap before the app Secret on realtime
    template: deployment-realtime.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: t-sim-redis

  # No inline env entry — that would beat every envFrom source and defeat the
  # override the ordering above provides.
  - it: never sets REDIS_URL as an inline container env
    template: deployment-app.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "redis://t-sim-redis:6379"

  - it: still bundles Redis in existingSecret mode
    template: configmap-redis.yaml
    set:
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - hasDocuments:
          count: 1

  - it: still bundles Redis under External Secrets
    template: configmap-redis.yaml
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
    asserts:
      - hasDocuments:
          count: 1

  - it: deploys nothing when app.env.REDIS_URL points elsewhere
    template: configmap-redis.yaml
    set:
      app.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - hasDocuments:
          count: 0

  - it: deploys nothing when redis.enabled=false
    template: configmap-redis.yaml
    set:
      redis.enabled: false
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: fails to render when redis.enabled=false and nothing supplies REDIS_URL
    template: deployment-app.yaml
    set:
      redis.enabled: false
      realtime.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "Sim requires Redis: redis.enabled=false but no REDIS_URL reaches the app pod. Set app.env.REDIS_URL to your Redis (redis:// or rediss://), add a REDIS_URL entry to extraEnvVars (e.g. valueFrom.secretKeyRef), supply it via app.secrets.existingSecret or externalSecrets.remoteRefs.app.REDIS_URL, or set redis.enabled=true to deploy the bundled Redis."

  - it: fails realtime too when redis.enabled=false and nothing supplies REDIS_URL
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      app.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "Sim requires Redis: redis.enabled=false but no REDIS_URL reaches the realtime pod. Set app.env.REDIS_URL to your Redis (redis:// or rediss://), add a REDIS_URL entry to extraEnvVars (e.g. valueFrom.secretKeyRef), supply it via app.secrets.existingSecret or externalSecrets.remoteRefs.app.REDIS_URL, or set redis.enabled=true to deploy the bundled Redis."

  - it: renders with redis.enabled=false when app.env.REDIS_URL is set
    template: deployment-app.yaml
    set:
      redis.enabled: false
      app.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - isKind:
          of: Deployment

  - it: accepts an extraEnvVars REDIS_URL, which is inlined on the app pod
    template: deployment-app.yaml
    set:
      redis.enabled: false
      extraEnvVars:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: managed-redis
              key: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: managed-redis
                key: url

  - it: accepts an extraEnvVars REDIS_URL, which is inlined on the realtime pod
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      extraEnvVars:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: managed-redis
              key: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: managed-redis
                key: url

  - it: rejects an extraEnvVars REDIS_URL entry with an empty value
    template: deployment-app.yaml
    set:
      redis.enabled: false
      realtime.enabled: false
      extraEnvVars:
        - name: REDIS_URL
          value: ""
    asserts:
      - failedTemplate:
          errorPattern: "no REDIS_URL reaches the app pod"

  # realtime.env lands in the app Secret, which both the app and realtime pods envFrom.
  - it: accepts realtime.env.REDIS_URL, written into the Secret both pods share
    template: secrets-app.yaml
    set:
      redis.enabled: false
      realtime.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - equal:
          path: stringData.REDIS_URL
          value: "rediss://:pw@managed.example.com:6380"

  - it: renders the shared app Secret for a realtime-only release so realtime.env.REDIS_URL reaches it
    template: secrets-app.yaml
    set:
      redis.enabled: false
      app.enabled: false
      realtime.env.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - equal:
          path: stringData.REDIS_URL
          value: "rediss://:pw@managed.example.com:6380"

  - it: accepts app.envDefaults.REDIS_URL for an app-only release
    template: deployment-app.yaml
    set:
      redis.enabled: false
      realtime.enabled: false
      app.envDefaults.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "rediss://:pw@managed.example.com:6380"

  # app.envDefaults is inlined on the app container only, so realtime is still uncovered.
  - it: rejects app.envDefaults.REDIS_URL alone when realtime is enabled
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      app.envDefaults.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - failedTemplate:
          errorPattern: "no REDIS_URL reaches the realtime pod"

  - it: accepts app.envDefaults plus realtime.envDefaults REDIS_URL, one per pod
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      app.envDefaults.REDIS_URL: "rediss://:pw@managed.example.com:6380"
      realtime.envDefaults.REDIS_URL: "rediss://:pw@managed.example.com:6380"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: "rediss://:pw@managed.example.com:6380"

  - it: fails a realtime-only External Secrets release when REDIS_URL is not mapped
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      app.enabled: false
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
      app.env.BETTER_AUTH_SECRET: ""
      app.env.ENCRYPTION_KEY: ""
      app.env.INTERNAL_API_SECRET: ""
      app.env.CRON_SECRET: ""
    asserts:
      - failedTemplate:
          errorPattern: "Required key 'REDIS_URL' is missing for the realtime pod"

  # External Secrets syncs only remoteRefs.app, and a disabled app's env is checked and synced nowhere.
  - it: does not count an unmapped app.env.REDIS_URL for a realtime-only External Secrets release
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      app.enabled: false
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
      app.env.BETTER_AUTH_SECRET: ""
      app.env.ENCRYPTION_KEY: ""
      app.env.INTERNAL_API_SECRET: ""
      app.env.CRON_SECRET: ""
      app.env.REDIS_URL: "redis://redis.example.com:6379"
    asserts:
      - failedTemplate:
          errorPattern: "Required key 'REDIS_URL' is missing for the realtime pod"

  # The realtime deployment skips inlining a default that app.env sets, so app.env masks it.
  - it: does not count a realtime.envDefaults REDIS_URL that an unsynced app.env.REDIS_URL masks
    template: deployment-realtime.yaml
    set:
      redis.enabled: false
      app.enabled: false
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
      app.env.BETTER_AUTH_SECRET: ""
      app.env.ENCRYPTION_KEY: ""
      app.env.INTERNAL_API_SECRET: ""
      app.env.CRON_SECRET: ""
      app.env.REDIS_URL: "redis://redis.example.com:6379"
      realtime.envDefaults.REDIS_URL: "redis://redis.example.com:6379"
    asserts:
      - failedTemplate:
          errorPattern: "Required key 'REDIS_URL' is missing for the realtime pod"

  - it: syncs the mapped REDIS_URL for a realtime-only External Secrets release
    template: external-secret-app.yaml
    set:
      redis.enabled: false
      app.enabled: false
      externalSecrets.remoteRefs.app.REDIS_URL: sim/app/redis-url
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
      app.env.BETTER_AUTH_SECRET: ""
      app.env.ENCRYPTION_KEY: ""
      app.env.INTERNAL_API_SECRET: ""
      app.env.CRON_SECRET: ""
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: REDIS_URL
            remoteRef:
              key: sim/app/redis-url

  - it: trusts a pre-created app Secret to carry REDIS_URL when redis.enabled=false
    template: deployment-app.yaml
    set:
      redis.enabled: false
      app.secrets.existingSecret.enabled: true
      app.secrets.existingSecret.name: my-app-secrets
    asserts:
      - isKind:
          of: Deployment

  - it: fails under External Secrets when redis.enabled=false and REDIS_URL is not mapped
    template: deployment-app.yaml
    set:
      redis.enabled: false
      realtime.enabled: false
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
      app.env.BETTER_AUTH_SECRET: ""
      app.env.ENCRYPTION_KEY: ""
      app.env.INTERNAL_API_SECRET: ""
      app.env.CRON_SECRET: ""
    asserts:
      - failedTemplate:
          errorPattern: "Required key 'REDIS_URL' is missing"

  - it: renders under External Secrets when redis.enabled=false and REDIS_URL is mapped
    template: deployment-app.yaml
    set:
      redis.enabled: false
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: my-store
      externalSecrets.remoteRefs.app.BETTER_AUTH_SECRET: sim/app/better-auth-secret
      externalSecrets.remoteRefs.app.ENCRYPTION_KEY: sim/app/encryption-key
      externalSecrets.remoteRefs.app.INTERNAL_API_SECRET: sim/app/internal-api-secret
      externalSecrets.remoteRefs.app.CRON_SECRET: sim/app/cron-secret
      externalSecrets.remoteRefs.app.REDIS_URL: sim/app/redis-url
      externalSecrets.remoteRefs.postgresql.password: sim/postgresql/password
      app.env.BETTER_AUTH_SECRET: ""
      app.env.ENCRYPTION_KEY: ""
      app.env.INTERNAL_API_SECRET: ""
      app.env.CRON_SECRET: ""
    asserts:
      - isKind:
          of: Deployment

  - it: does not preset free-tier plan caps, which are opt-in on a self-host
    template: deployment-app.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXECUTION_TIMEOUT_FREE
            value: "300"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FREE_TABLES_LIMIT
            value: "3"
