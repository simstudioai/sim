name: setup
description: Install the pinned Bun and Node toolchain, mount the dependency (and optionally Turbo) caches, and install workspace dependencies.

inputs:
  provider:
    description: The CI_PROVIDER repo variable, forwarded to the cache action.
    required: false
    default: ''
  turbo-cache-key:
    description: Suffix for a Turbo cache mounted at ./.turbo. Empty skips the mount. Jobs that write Turbo entries need distinct suffixes, or last-writer-wins commits evict each other's entries.
    required: false
    default: ''
  node-version:
    description: Node version to install. Empty keeps the runner's preinstalled Node, for jobs that only ever ran Bun.
    required: false
    default: '24'
  registry-url:
    description: npm registry to write an .npmrc for, so `npm publish` reads NODE_AUTH_TOKEN. Empty writes none.
    required: false
    default: ''
  save-dependency-cache:
    description: Save GitHub dependency caches after installation. Parallel matrices can elect one writer.
    required: false
    default: 'true'

# Writes stay scoped by event and fork status. Trusted GitHub PRs can read the
# default branch's push caches; push jobs never read PR caches.
#
# node_modules also keys on the lockfile hash: a sticky disk is a mutable volume,
# and `bun install --frozen-lockfile` adds what the lockfile needs without
# pruning what it dropped, so branches on different lockfiles were contaminating
# each other (a stale @next/swc 16.2.6 outlived the 16.2.11 bump). The bun and
# Turbo caches are content/hash-addressed, so they stay shared — that is what
# keeps a fresh node_modules disk cheap to fill.
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4

    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Mount Bun cache
      if: inputs.provider == '' || inputs.provider == 'blacksmith'
      uses: ./.github/actions/cache
      with:
        provider: ${{ inputs.provider }}
        key: ${{ github.repository }}-bun-cache-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}
        path: ~/.bun/install/cache

    - name: Mount node_modules
      if: inputs.provider == '' || inputs.provider == 'blacksmith'
      uses: ./.github/actions/cache
      with:
        provider: ${{ inputs.provider }}
        key: ${{ github.repository }}-node-modules-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ hashFiles('bun.lock') }}
        path: ./node_modules

    - name: Restore Bun cache
      id: bun-cache
      if: inputs.provider != '' && inputs.provider != 'blacksmith'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        key: ${{ github.repository }}-bun-cache-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ github.run_id }}
        restore-keys: |
          ${{ github.repository }}-bun-cache-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-
          ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && format('{0}-bun-cache-push-', github.repository) || '' }}
        path: ~/.bun/install/cache

    - name: Restore node_modules
      id: node-modules-cache
      if: inputs.provider != '' && inputs.provider != 'blacksmith'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        key: ${{ github.repository }}-node-modules-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
        restore-keys: |
          ${{ github.repository }}-node-modules-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ hashFiles('bun.lock') }}-
          ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && format('{0}-node-modules-push-{1}-', github.repository, hashFiles('bun.lock')) || '' }}
        path: ./node_modules

    - name: Mount Turbo cache
      if: inputs.turbo-cache-key != '' && (inputs.provider == '' || inputs.provider == 'blacksmith')
      uses: ./.github/actions/cache
      with:
        provider: ${{ inputs.provider }}
        key: ${{ github.repository }}-${{ inputs.turbo-cache-key }}-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}
        path: ./.turbo

    - name: Restore and save Turbo cache
      if: inputs.turbo-cache-key != '' && inputs.provider != '' && inputs.provider != 'blacksmith'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        key: ${{ github.repository }}-${{ inputs.turbo-cache-key }}-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ github.run_id }}
        restore-keys: ${{ github.repository }}-${{ inputs.turbo-cache-key }}-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-
        path: ./.turbo

    # Bun retries a failed request itself, but a registry connection that stalls
    # without failing leaves `bun install` waiting until the job's own timeout
    # cancels it, the whole budget spent on one hung step. Healthy installs finish
    # in under two and a half minutes cold, so an attempt past three is stalled:
    # kill it and retry once, which leaves room inside the shortest caller's
    # 10-minute job timeout. Any other failure is real and fails at once.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2; do
          timeout --kill-after=15s 3m bun install --frozen-lockfile --ignore-scripts && exit 0
          status=$?
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi
          echo "::warning title=bun install stalled::attempt ${attempt} of 2 ran past 3 minutes"
        done
        echo "::error title=bun install stalled::both attempts ran past 3 minutes"
        exit 1

    - name: Save Bun cache
      if: inputs.provider != '' && inputs.provider != 'blacksmith' && inputs.save-dependency-cache == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        key: ${{ github.repository }}-bun-cache-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ github.run_id }}
        path: ~/.bun/install/cache

    - name: Save node_modules
      if: inputs.provider != '' && inputs.provider != 'blacksmith' && inputs.save-dependency-cache == 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        key: ${{ github.repository }}-node-modules-${{ github.event_name }}${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
        path: ./node_modules
