name: dev-cache
description: Mount Turbopack's dev cache at apps/sim/.next/dev for one `next dev` app, keyed by app, event, fork, installed Next version and the app's environment.

inputs:
  provider:
    description: The CI_PROVIDER repo variable, forwarded to the cache action.
    required: false
    default: ''
  name:
    description: The app the cache belongs to. Each app runs `next dev` under its own fixed NEXT_PUBLIC_* values, so each gets its own cache.
    required: true
  env-hash:
    description: Hash of the file that sets the app's environment. Next inlines NEXT_PUBLIC_* values at compile time, so a changed environment must never restore a cache compiled under the old one.
    required: true

# The cache turns a route's cold compile into a restore. It is content-addressed, so changed modules
# still recompile. The Next version in the key starts an upgrade from an empty cache, and the event
# and fork segments keep untrusted runs off the cache trusted runs read. Needs dependencies installed
# (it reads node_modules/next), and the app must be stopped with SIGINT so the last write completes.
runs:
  using: composite
  steps:
    - name: Resolve Turbopack dev cache key
      id: key
      shell: bash
      env:
        APP: ${{ inputs.name }}
        FORK_SUFFIX: ${{ github.event.pull_request.head.repo.fork && '-fork' || '' }}
        ENV_HASH: ${{ inputs.env-hash }}
      run: echo "value=${GITHUB_REPOSITORY}-next-dev-${APP}-${GITHUB_EVENT_NAME}${FORK_SUFFIX}-$(jq -r .version node_modules/next/package.json)-${ENV_HASH:0:12}" >> "$GITHUB_OUTPUT"

    - name: Mount Turbopack dev cache
      uses: ./.github/actions/cache
      with:
        provider: ${{ inputs.provider }}
        key: ${{ steps.key.outputs.value }}
        path: ./apps/sim/.next/dev
