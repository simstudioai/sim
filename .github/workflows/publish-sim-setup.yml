name: publish-sim-setup

on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'packages/sim-setup/**'
      - 'packages/deployment-config/**'
      - 'packages/security/**'
      - 'packages/utils/**'
      - 'docker-compose.prod.yml'
      - 'bun.lock'
      # A change to how the package is built or published has to republish it.
      - '.github/workflows/publish-sim-setup.yml'

# npm trusted publishing: the publish step trades the runner's OIDC token for a
# short-lived npm credential, so no npm token is stored anywhere.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sim-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ${{ (vars.CI_PROVIDER == '' || vars.CI_PROVIDER == 'blacksmith') && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Node 24 bundles npm 11.5.1+, which trusted publishing requires; the
      # published bundle is still smoke-tested on Node 20 below, its minimum
      # supported runtime.
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          provider: ${{ vars.CI_PROVIDER }}
          node-version: '24'

      - name: Auto-bump package version
        run: bun run bump:npm-packages sim-setup

      - name: Check generated deployment config
        run: bun run check:deployment-config

      - name: Run tests
        working-directory: packages/sim-setup
        run: bun run test

      - name: Type-check packages
        run: |
          bun run --cwd packages/deployment-config type-check
          bun run --cwd packages/sim-setup type-check

      - name: Build package
        working-directory: packages/sim-setup
        run: bun run build

      - name: Resolve release channel
        id: release
        working-directory: packages/sim-setup
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          BASE_VERSION="$(bun -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must be a stable X.Y.Z base, got '$BASE_VERSION'." >&2
            exit 1
          fi

          case "$BRANCH" in
            dev)
              VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              TAG="dev"
              ;;
            staging)
              VERSION="${BASE_VERSION}-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              TAG="staging"
              ;;
            main)
              VERSION="$BASE_VERSION"
              TAG="latest"
              ;;
            *)
              echo "Unsupported release branch '$BRANCH'." >&2
              exit 1
              ;;
          esac

          bun pm pkg set "version=$VERSION"
          RESOLVED_VERSION="$(bun -p "require('./package.json').version")"
          if [ "$RESOLVED_VERSION" != "$VERSION" ]; then
            echo "Version injection mismatch: wanted '$VERSION', got '$RESOLVED_VERSION'." >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      # Bun packs because it rewrites `workspace:` ranges to real versions,
      # which `npm pack` would publish verbatim. The smoke test and the publish
      # below both use this one tarball, so what was tested is what ships.
      - name: Pack package
        id: pack
        working-directory: packages/sim-setup
        run: |
          TARBALL="$RUNNER_TEMP/sim-setup.tgz"
          bun pm pack --ignore-scripts --filename "$TARBALL" --quiet
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20 for the bundle smoke test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'

      - name: Smoke-test packed Node bundle
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "$RUNNER_TEMP/sim-setup-smoke.XXXXXX")"
          tar -xzf "$TARBALL" -C "$SMOKE_DIR"

          if tar -tzf "$TARBALL" | grep -Eq '^package/(apps|docker|helm|packages|scripts)/'; then
            echo 'Packed setup package contains repository source directories.' >&2
            exit 1
          fi
          test -x "$SMOKE_DIR/package/dist/index.js"
          test -f "$SMOKE_DIR/package/dist/docker-compose.prod.yml"
          if grep -Eq '^[[:space:]]+(build|context):' "$SMOKE_DIR/package/dist/docker-compose.prod.yml"; then
            echo 'Production Compose asset contains a local build dependency.' >&2
            exit 1
          fi

          cd "$SMOKE_DIR"
          test "$(node package/dist/index.js --version)" = "$VERSION"
          node package/dist/index.js --help
          for command in config add doctor start stop restart update status logs down reset; do
            node package/dist/index.js "$command" --help > /dev/null
          done
          node package/dist/index.js add integration --help > /dev/null
          if node package/dist/index.js --quik > /dev/null 2>&1; then
            echo 'Packed setup CLI accepted an unknown option.' >&2
            exit 1
          fi
          if node package/dist/index.js start extra > /dev/null 2>&1; then
            echo 'Packed setup CLI accepted an extra lifecycle operand.' >&2
            exit 1
          fi

      - name: Setup Node 24 for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Verify version is unpublished
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if bun pm view "sim-setup@$VERSION" version > /dev/null 2>&1; then
            echo "sim-setup@$VERSION is already published. The automatic version bump did not produce a unique release." >&2
            exit 1
          fi

      # npm publishes a tarball without running lifecycle scripts, so nothing
      # rebuilds `dist` here. Provenance is attached automatically.
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NPM_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$TARBALL" --access public --tag "$NPM_TAG"

      - name: Summarize release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.tag }}
        run: echo "Published sim-setup@$VERSION with the '$NPM_TAG' tag."
