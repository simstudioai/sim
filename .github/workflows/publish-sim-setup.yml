name: publish-sim-setup

on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'packages/sim-setup/**'
      - 'packages/deployment-config/**'
      - 'packages/security/**'
      - 'packages/utils/**'
      - 'docker-compose.prod.yml'
      - 'bun.lock'
      # A change to how the package is built or published has to republish it.
      - '.github/workflows/publish-sim-setup.yml'

permissions:
  contents: read

concurrency:
  group: publish-sim-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ${{ (vars.CI_PROVIDER == '' || vars.CI_PROVIDER == 'blacksmith') && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Vitest 5 requires Node 22.12+; the published bundle is still
      # smoke-tested on Node 20 below, its minimum supported runtime.
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          provider: ${{ vars.CI_PROVIDER }}
          node-version: '22'

      - name: Auto-bump package version
        run: bun run bump:npm-packages sim-setup

      - name: Check generated deployment config
        run: bun run check:deployment-config

      - name: Run tests
        working-directory: packages/sim-setup
        run: bun run test

      - name: Type-check packages
        run: |
          bun run --cwd packages/deployment-config type-check
          bun run --cwd packages/sim-setup type-check

      - name: Build package
        working-directory: packages/sim-setup
        run: bun run build

      - name: Resolve release channel
        id: release
        working-directory: packages/sim-setup
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          BASE_VERSION="$(bun -p "require('./package.json').version")"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must be a stable X.Y.Z base, got '$BASE_VERSION'." >&2
            exit 1
          fi

          case "$BRANCH" in
            dev)
              VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              TAG="dev"
              ;;
            staging)
              VERSION="${BASE_VERSION}-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              TAG="staging"
              ;;
            main)
              VERSION="$BASE_VERSION"
              TAG="latest"
              ;;
            *)
              echo "Unsupported release branch '$BRANCH'." >&2
              exit 1
              ;;
          esac

          bun pm pkg set "version=$VERSION"
          RESOLVED_VERSION="$(bun -p "require('./package.json').version")"
          if [ "$RESOLVED_VERSION" != "$VERSION" ]; then
            echo "Version injection mismatch: wanted '$VERSION', got '$RESOLVED_VERSION'." >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      # Bun packs because it rewrites `workspace:` ranges to real versions,
      # which `npm pack` would publish verbatim. The smoke test below and the
      # publish job both use this one tarball, so what was tested is what ships.
      - name: Pack package
        working-directory: packages/sim-setup
        run: bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/package.tgz" --quiet

      - name: Setup Node 20 for the bundle smoke test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'

      - name: Smoke-test packed Node bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "$RUNNER_TEMP/sim-setup-smoke.XXXXXX")"
          tar -xzf "$RUNNER_TEMP/package.tgz" -C "$SMOKE_DIR"

          if tar -tzf "$RUNNER_TEMP/package.tgz" | grep -Eq '^package/(apps|docker|helm|packages|scripts)/'; then
            echo 'Packed setup package contains repository source directories.' >&2
            exit 1
          fi
          test -x "$SMOKE_DIR/package/dist/index.js"
          test -f "$SMOKE_DIR/package/dist/docker-compose.prod.yml"
          if grep -Eq '^[[:space:]]+(build|context):' "$SMOKE_DIR/package/dist/docker-compose.prod.yml"; then
            echo 'Production Compose asset contains a local build dependency.' >&2
            exit 1
          fi

          cd "$SMOKE_DIR"
          test "$(node package/dist/index.js --version)" = "$VERSION"
          node package/dist/index.js --help
          for command in config add doctor start stop restart update status logs down reset; do
            node package/dist/index.js "$command" --help > /dev/null
          done
          node package/dist/index.js add integration --help > /dev/null
          if node package/dist/index.js --quik > /dev/null 2>&1; then
            echo 'Packed setup CLI accepted an unknown option.' >&2
            exit 1
          fi
          if node package/dist/index.js start extra > /dev/null 2>&1; then
            echo 'Packed setup CLI accepted an extra lifecycle operand.' >&2
            exit 1
          fi

      - name: Verify version is unpublished
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if bun pm view "sim-setup@$VERSION" version > /dev/null 2>&1; then
            echo "sim-setup@$VERSION is already published. The automatic version bump did not produce a unique release." >&2
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 1

  # npm trusted publishing trades this job's OIDC token for a short-lived npm
  # credential, so no npm token is stored anywhere. npm accepts the token only
  # from GitHub-hosted runners, and only this job can mint one: it runs no
  # repository code, it publishes the tarball the build job tested. npm runs no
  # lifecycle scripts for a tarball, so nothing is rebuilt here, and provenance
  # is attached automatically.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # Node 24 bundles npm 11.5.1+, which trusted publishing requires.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.build.outputs.tag }}
        run: npm publish "$RUNNER_TEMP/package.tgz" --access public --tag "$NPM_TAG"

      - name: Summarize release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NPM_TAG: ${{ needs.build.outputs.tag }}
        run: echo "Published sim-setup@$VERSION with the '$NPM_TAG' tag."
