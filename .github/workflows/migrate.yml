name: migrate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}
      - name: Read staging deployment and ECS retirement evidence
        env:
          ECR_APP: ${{ secrets.ECR_APP }}
        run: |
          set -euo pipefail
          aws deploy get-deployment-group --application-name sim-staging-us-east-1-ecs-app --deployment-group-name sim-staging-us-east-1-app-dg --query 'deploymentGroupInfo.{lastSuccessfulDeployment:lastSuccessfulDeployment,lastAttemptedDeployment:lastAttemptedDeployment,ecsServices:ecsServices}' --output json
          aws codepipeline list-pipeline-executions --pipeline-name sim-staging-us-east-1-app-deployment --max-items 3 --query 'pipelineExecutionSummaries[].{id:pipelineExecutionId,status:status,start:startTime,revisions:sourceRevisions}' --output json
          aws ecr describe-images --repository-name "$ECR_APP" --image-ids imageDigest=sha256:563d48611fafaaf7b06998f9c9457c1da5959da311a8d862470682c0d7276200 --query 'imageDetails[].{digest:imageDigest,tags:imageTags}' --output json
          python3 .github/scripts/check-project-rollout.py --environment staging --region "$AWS_REGION" --expected-image-digest sha256:563d48611fafaaf7b06998f9c9457c1da5959da311a8d862470682c0d7276200
