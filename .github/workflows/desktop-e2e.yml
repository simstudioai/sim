name: desktop-staging-qa-package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Package a universal staging app
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SIM_DESKTOP_DEFAULT_ORIGIN: https://staging.sim.ai
        run: |
          bun run build
          bunx electron-builder --mac dir --universal --publish never -c.productName='Sim Staging' -c.appId=ai.sim.desktop.staging -c.mac.identity=- -c.mac.notarize=false -c.extraMetadata.version=0.9.17-staging.qa8835.1
          ditto -c -k --keepParent 'release/mac-universal/Sim Staging.app' sim-staging-qa.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sim-staging-qa-package
          path: apps/desktop/sim-staging-qa.zip
          retention-days: 7
