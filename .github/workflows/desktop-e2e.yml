name: desktop-consent-validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [positive, storage-negative]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Remove only the storage-failure UI synchronization for the negative control
        if: matrix.mode == 'storage-negative'
        run: |
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p = Path('apps/desktop/src/main/desktop-settings.ts')
          s = p.read_text()
          guard = '        deps.onFullFileAccessChanged?.(read())\n'
          assert s.count(guard) == 1
          p.write_text(s.replace(guard, '', 1))
          PYCONTROL
      - run: bun run --cwd apps/desktop build
      - name: Exercise real Electron boundaries
        working-directory: apps/desktop
        env:
          CONTROL_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p test-results
          set +e
          if [ "$CONTROL_MODE" = positive ]; then
            bunx playwright test e2e/local-files.spec.ts --repeat-each=3 --retries=0 --trace=on --reporter=json > acceptance-report.json
          else
            bunx playwright test e2e/local-files.spec.ts --retries=0 --reporter=json > acceptance-report.json
          fi
          test_exit=$?
          set -e
          TEST_EXIT="$test_exit" python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report = json.loads(Path('acceptance-report.json').read_text())
          def errors(suites):
              for suite in suites:
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          for result in test.get('results', []):
                              yield from result.get('errors', [])
                  yield from errors(suite.get('suites', []))
          failures = list(errors(report['suites']))
          exit_code = int(os.environ['TEST_EXIT'])
          if os.environ['CONTROL_MODE'] == 'positive':
              assert exit_code == 0, failures
          else:
              assert exit_code != 0, 'Negative control unexpectedly passed'
              assert any('expect(toggle).not.toBeChecked()' in error.get('message', '') and 'toBeChecked' in error.get('message', '') for error in failures), failures
          print(json.dumps({'mode': os.environ['CONTROL_MODE'], 'testExit': exit_code, 'verified': True}))
          PYREPORT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consent-${{ matrix.mode }}
          path: |
            apps/desktop/test-results
            apps/desktop/acceptance-report.json
