name: platform-design

on:
  pull_request:
    paths:
      - 'apps/sim/platform/**'
      - 'apps/sim/package.json'
      - 'scripts/check-platform-design*'
      - 'scripts/platform-variant-usage.ts'
      - 'scripts/sync-platform-*.ts'
      - '.github/workflows/platform-design.yml'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          provider: github
      - run: bun run --cwd apps/sim build:platform
      - run: bunx --no-install playwright install --with-deps --only-shell chromium
        working-directory: apps/sim
      - run: bun run --cwd apps/sim test:platform:e2e
        env:
          PLATFORM_REPORT_PATH: ${{ runner.temp }}/platform-design/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: platform-design-browser
          path: ${{ runner.temp }}/platform-design
          retention-days: 7
