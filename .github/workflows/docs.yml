name: docs

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: false
      OPENAI_API_KEY:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_AUDIENCE:
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: I verified the matching docs deployment and a restorable index backup
        type: boolean
        required: true
        default: false
      deployed_revision:
        description: Full source SHA of the verified serving docs deployment
        type: string
        required: true
      deployment_id:
        description: Verified serving docs deployment ID
        type: string
        required: true
      backup_reference:
        description: Restorable docs_embeddings backup identifier (no credentials)
        type: string
        required: true

permissions:
  contents: read

jobs:
  embeddings:
    name: embeddings
    # Network-bound on the embeddings API: ~9% CPU and ~3% peak memory on 8 vCPU.
    runs-on: ${{ (vars.CI_PROVIDER == '' || vars.CI_PROVIDER == 'blacksmith') && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    concurrency:
      group: docs-search-index-production
      cancel-in-progress: false
    permissions:
      contents: read
      # Tailscale workload identity federation exchanges this job's OIDC token.
      id-token: write

    steps:
      - name: Record verified deployment and backup
        env:
          DEPLOYED_REVISION: ${{ inputs.deployed_revision }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          test "$DEPLOYED_REVISION" = "$GITHUB_SHA"
          test -n "$DEPLOYMENT_ID"
          test -n "$BACKUP_REFERENCE"
          jq -n --arg revision "$DEPLOYED_REVISION" --arg deployment "$DEPLOYMENT_ID" \
            --arg backup "$BACKUP_REFERENCE" --arg actor "$GITHUB_ACTOR" \
            '{revision: $revision, deploymentId: $deployment, backupReference: $backup, verifiedBy: $actor}' \
            > "$RUNNER_TEMP/docs-search-authorization.json"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          provider: ${{ vars.CI_PROVIDER }}
          node-version: '24'

      # Database IP restrictions admit the tailnet's app connector; see migrate.yml.
      - name: Join the tailnet
        if: vars.CI_DB_TAILNET == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          args: --accept-routes

      - name: Process docs embeddings
        working-directory: ./apps/docs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bun run content:generate
          DOCS_SEARCH_REPORT_PATH=test-results/docs-search-publish.json bun run scripts/index-search.ts
          DOCS_SEARCH_REPORT_PATH=test-results/docs-search-check.json bun run scripts/index-search.ts --check

      - name: Upload search index report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-search-index
          path: |
            apps/docs/test-results/docs-search-*.json
            ${{ runner.temp }}/docs-search-authorization.json
