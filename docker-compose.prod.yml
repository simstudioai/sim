services:
  simstudio:
    env_file:
      - path: .env
        required: false
    image: ghcr.io/simstudioai/simstudio:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          memory: 8G
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # TRUSTED_ORIGINS: comma-separated public origins to trust for auth in
      # addition to NEXT_PUBLIC_APP_URL. Use when serving from multiple domains
      # (apex + www, alias hostnames, reverse-proxy IPs). Empty by default.
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      # AUTH_TRUSTED_PROXIES: comma-separated reverse-proxy IPs or CIDR ranges in
      # front of the app (ingress, load balancer). When set, Better Auth AND
      # Sim's own per-IP throttles walk x-forwarded-for right to left, skip these
      # hops, and use the first untrusted address as the client IP — never the
      # leftmost entry, which the caller supplies and could otherwise be rotated
      # to mint a fresh rate-limit bucket per request. Empty by default, and then
      # the two differ: Better Auth trusts only a single-value header (recording
      # no IP for a multi-hop chain), while Sim's throttles key on the rightmost
      # (proxy-written) entry — not spoofable, but behind a multi-hop chain
      # (e.g. CDN in front of ingress) it collapses callers onto the edge
      # addresses. Set your real hops for per-client keying and correct session
      # IPs. Use the proxies' actual addresses, NOT a broad private range that
      # also covers clients: a caller inside a trusted range makes the whole
      # chain trusted. This all assumes a proxy that appends the peer address —
      # an app exposed directly to the internet sees only what the caller wrote.
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-}
      # TRUST_PROXY_HEADERS: whether x-forwarded-for / x-real-ip may be believed.
      # Defaults to FALSE here because this file publishes port 3000 directly and
      # ships no reverse proxy — with nothing in front, those headers are written
      # entirely by the caller, and believing them would let anyone rotate a
      # header to get a fresh per-IP rate-limit bucket on every request. While
      # false, per-IP limits collapse into one shared bucket: blunt, but it fails
      # closed. Set it to true once a proxy that APPENDS the peer address (nginx,
      # Caddy, Traefik, an ALB, Cloudflare) terminates in front of the app, and
      # set AUTH_TRUSTED_PROXIES to that proxy's address at the same time.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_ENCRYPTION_KEY=${API_ENCRYPTION_KEY:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - COPILOT_API_KEY=${COPILOT_API_KEY:-}
      - NEXT_PUBLIC_CHAT_DISABLED=${NEXT_PUBLIC_CHAT_DISABLED:-}
      - SIM_AGENT_API_URL=${SIM_AGENT_API_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - SOCKET_SERVER_URL=${SOCKET_SERVER_URL:-http://realtime:3002}
      # NEXT_PUBLIC_SOCKET_URL is read by the browser. Leave it unset for this
      # stack: the client already falls back to localhost:3002 for a localhost
      # page, and a proxied deployment needs the page-origin fallback that an
      # explicit value would suppress. Set it only when realtime is on a
      # different host:port (e.g. wss://socket.example.com).
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-}
      - ADMISSION_GATE_MAX_INFLIGHT=${ADMISSION_GATE_MAX_INFLIGHT:-500}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  realtime:
    env_file:
      - path: .env
        required: false
    image: ghcr.io/simstudioai/realtime:latest
    restart: unless-stopped
    ports:
      - '3002:3002'
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3002/health']
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'

  # Backs pub/sub (live Chat task-status and table events) and the shared caches.
  # The app falls back to PostgreSQL for storage when REDIS_URL is unset, but the
  # pub/sub channels have no fallback — without Redis, live status never streams.
  # Not published to the host: only the app and realtime containers need it, and
  # binding 6379 would collide with a Redis already running locally.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-simstudio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
